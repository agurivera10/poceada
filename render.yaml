services:
  - type: web
    name: poceada-lab
    runtime: node
    repo: https://github.com/agurivera10/poceada.git
    branch: main
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: checksPass
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://oxjjmozpjbnawewdyuso.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_sLZPLOcYOBQgns1HO1LMZw_a32mK_5b
      - key: SUPABASE_URL
        value: https://oxjjmozpjbnawewdyuso.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LAB_ADMIN_PASSWORD
        sync: false
      - key: LAB_SESSION_SECRET
        generateValue: true
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_TASK
        value: poceada-compute/process_job

  - type: workflow
    name: poceada-compute
    slug: poceada-compute
    runtime: python
    region: oregon
    buildCommand: pip install -r simulations/requirements.txt
    startCommand: python -m simulations.render_workflow
    autoDeployTrigger: checksPass
    envVars:
      - key: SUPABASE_URL
        value: https://oxjjmozpjbnawewdyuso.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
