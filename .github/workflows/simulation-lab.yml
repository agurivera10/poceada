name: Simulation Lab

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Simulation preset
        required: true
        type: choice
        default: portfolio-null-geometry-v1
        options:
          - portfolio-null-geometry-v1
          - selection-shadow-v1
          - null-season-patterns-v1
          - multiple-testing-redteam-v1
      iterations:
        description: Total iterations across all shards
        required: true
        default: "10000000"
        type: string
      seed:
        description: Base deterministic seed
        required: true
        default: "317900001"
        type: string

permissions:
  contents: read

jobs:
  simulate:
    name: shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: simulations/requirements.txt
      - name: Install scientific runtime
        run: pip install --requirement simulations/requirements.txt
      - name: Run deterministic shard
        run: |
          python simulations/run_simulation.py \
            --preset "${{ inputs.preset }}" \
            --iterations "${{ inputs.iterations }}" \
            --seed "${{ inputs.seed }}" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 8 \
            --output "out/shard-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: simulation-shard-${{ matrix.shard }}
          path: out/shard-${{ matrix.shard }}.json
          retention-days: 30

  merge:
    needs: simulate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: simulation-shard-*
          path: shards
          merge-multiple: true
      - name: Merge and hash results
        run: python simulations/merge_results.py --input-dir shards --output simulation-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: simulation-result-${{ github.run_id }}
          path: simulation-result.json
          retention-days: 90
      - name: Summary
        run: |
          echo "## Simulation Lab" >> "$GITHUB_STEP_SUMMARY"
          echo "Preset: ${{ inputs.preset }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Iterations: ${{ inputs.iterations }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Seed: ${{ inputs.seed }}" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('simulation-result.json'))
          print(f"Result SHA-256: `{d['result_sha256']}`")
          print(f"Aggregated runtime: {d['aggregate_runtime_seconds']:.1f} shard-seconds")
          for family, values in d.get('probabilities', {}).items():
              print(f"\n### {family}")
              for k,v in values.items(): print(f"- {k}: {v:.8%}")
          PY
