name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: simulations/requirements.txt
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact dependency tree
        run: npm ci
      - name: Install simulation runtime
        run: pip install --requirement simulations/requirements.txt
      - name: Science invariants
        run: npm run test:science
      - name: Simulation engine smoke tests
        run: |
          python simulations/run_simulation.py --preset portfolio-null-geometry-v1 --iterations 2000 --seed 123456 --output /tmp/portfolio.json
          python simulations/run_simulation.py --preset selection-shadow-v1 --iterations 1000 --seed 654321 --output /tmp/shadow.json
          python -m py_compile simulations/worker.py simulations/worker_client.py simulations/optimizer.py simulations/render_workflow.py
          python - <<'PY'
          import json
          import simulations.render_workflow as render_workflow
          from simulations.optimizer import optimize_portfolio
          for path, n in [('/tmp/portfolio.json', 2000),('/tmp/shadow.json',1000)]:
              d=json.load(open(path))
              assert d['iterations']==n
              assert d['engine_version']=='SIM_ENGINE_V2'
              assert len(d['result_sha256'])==64
              for family, events in d.get('event_counts', {}).items():
                  for tier in range(2,6):
                      assert f'at_least_{tier}' in events
                      assert f'max_exactly_{tier}' in events
                  sums=d['ticket_sums'][family]
                  for tier in range(2,6):
                      assert f'exactly_{tier}' in sums
                      assert f'at_least_{tier}' in sums
          opt=optimize_portfolio(iterations=2000, seed=42)
          assert opt['score']['unique_4_subsets']==30
          assert opt['score']['max_pair_overlap']<=1
          assert 0 < opt['exact']['event_probabilities']['at_least_4'] < 0.01
          assert len(opt['result_sha256'])==64
          assert render_workflow.WORKFLOW_VERSION=='RENDER_WORKFLOW_V1'
          print('simulation V2 + optimizer + worker + Render Workflow smoke tests OK')
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://oxjjmozpjbnawewdyuso.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_sLZPLOcYOBQgns1HO1LMZw_a32mK_5b
      - name: Persist lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add npm lockfile"
            git push
          fi
      - name: Upload lockfile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: ignore
